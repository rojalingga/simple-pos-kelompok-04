
# Perbandingan pengalaman pengujian API (Postman vs curl):
# Pengujian tiga endpoint utama melalui Postman terasa lebih terstruktur karena token
# dapat disimpan sebagai environment variable, header Authorization dan Idempotency-Key
# dapat diatur melalui antarmuka, serta status, header, dan body respons dapat diperiksa
# dalam satu jendela. Postman juga memudahkan penyimpanan dan pengulangan request tanpa
# mengetik ulang perintah. Sebaliknya, curl lebih ringan dan cepat untuk request sekali
# pakai karena langsung dijalankan di terminal dan mudah disalin ke dokumentasi, tetapi
# pengelolaan token, header, dan pembacaan response JSON harus dilakukan secara manual.
# Dengan demikian, Postman/Insomnia lebih cocok untuk eksplorasi dan pengujian berulang,
# sedangkan curl lebih praktis untuk verifikasi cepat dan otomatisasi.
openapi: 3.0.0

info:
  title: Simple POS API
  version: 1.0.0
  description: Dokumentasi REST API untuk aplikasi Simple POS.

paths:

  /api/v1/login:
    post:
      summary: Login dan dapatkan token

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: kasir@pos.test
                password:
                  type: string
                  example: password
              required:
                - email
                - password

      responses:
        '200':
          description: Token berhasil diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/v1/categories:
    get:
      summary: Ambil daftar kategori

      security:
        - bearerAuth: []

      responses:
        '200':
          description: Daftar kategori diurutkan berdasarkan nama
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        products_count:
                          type: integer

        '401':
          description: Token tidak ada atau tidak valid

        '403':
          description: Token tidak memiliki ability categories:read

  /api/v1/products:
    get:
      summary: Ambil daftar produk
      description: >
        Mengembalikan daftar produk dengan paginasi. Dapat difilter berdasarkan
        kategori, dicari berdasarkan nama, dan diurutkan berdasarkan nama atau harga.

      security:
        - bearerAuth: []

      parameters:
        - name: category_id
          in: query
          description: Filter produk berdasarkan ID kategori.
          required: false
          schema:
            type: integer
            example: 1

        - name: q
          in: query
          description: Cari produk berdasarkan nama (minimal 2 karakter).
          required: false
          schema:
            type: string
            minLength: 2
            example: kopi

        - name: sort
          in: query
          description: Urutkan produk berdasarkan nama atau harga. Awali dengan tanda minus untuk urutan menurun.
          required: false
          schema:
            type: string
            enum:
              - name
              - '-name'
              - price
              - '-price'
            default: name

        - name: page
          in: query
          description: Nomor halaman yang ingin ditampilkan.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: per_page
          in: query
          description: Jumlah produk per halaman.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15

      responses:
        '200':
          description: Daftar produk berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: Kopi
                        price:
                          type: integer
                          example: 15000
                        category:
                          type: string
                          example: Minuman

                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        format: uri
                        nullable: true
                        example: http://localhost/api/v1/products?page=1
                      last:
                        type: string
                        format: uri
                        nullable: true
                        example: http://localhost/api/v1/products?page=2
                      prev:
                        type: string
                        format: uri
                        nullable: true
                        example: null
                      next:
                        type: string
                        format: uri
                        nullable: true
                        example: http://localhost/api/v1/products?page=2

                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: integer
                        nullable: true
                        example: 1
                      last_page:
                        type: integer
                        example: 2
                      links:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              format: uri
                              nullable: true
                            label:
                              type: string
                              example: '&laquo; Previous'
                            active:
                              type: boolean
                      path:
                        type: string
                        format: uri
                        example: http://localhost/api/v1/products
                      per_page:
                        type: integer
                        example: 15
                      to:
                        type: integer
                        nullable: true
                        example: 15
                      total:
                        type: integer
                        example: 20

        '401':
          description: Token tidak ada atau tidak valid

        '403':
          description: Token tidak memiliki ability products:read

        '422':
          description: Parameter query tidak valid, misalnya category_id tidak ditemukan atau per_page di luar rentang

  /api/v1/transactions:
    post:
      summary: Buat transaksi baru

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id:
                        type: integer
                      qty:
                        type: integer
                    required:
                      - product_id
                      - qty
              required:
                - items

      responses:
        '201':
          description: Transaksi berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      total:
                        type: integer

        '401':
          description: Token tidak ada atau tidak valid

        '422':
          description: Input tidak valid, misalnya product_id tidak ditemukan

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
